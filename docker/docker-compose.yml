# Local development only; do not expose these ports publicly
version: "3.9"
services:
  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data/js"]
    ports: ["4222:4222"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 4222"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: secr3t
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
