[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "StreetCred Clash API Gateway"
authors = ["Your Name <you@example.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
strawberry-graphql = {extras = ["fastapi"], version = "^0.237.1"}
grpcio = "^1.64.1"
grpcio-tools = "^1.64.1"
# FIX: Pin pydantic to version 1.x to resolve the ImportError
# with strawberry-graphql's experimental pydantic feature.
pydantic = "<2"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"