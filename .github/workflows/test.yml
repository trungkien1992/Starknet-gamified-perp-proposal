name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cairo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Build contracts
        run: |
          cd contracts
          scarb build
      
      - name: Run contract tests
        run: |
          cd contracts
          scarb test
      
      - name: Run gas tests
        run: |
          cd contracts
          scarb test --gas
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: contracts/target/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get
      
      - name: Run frontend tests
        run: |
          cd frontend
          flutter test
      
      - name: Build web
        run: |
          cd frontend
          flutter build web --release
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test/

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-contracts, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Katana
        run: |
          docker run -d \
            -p 5050:5050 \
            --name katana \
            ghcr.io/dojoengine/katana:v1.5.4 \
            katana --dev --http.addr 0.0.0.0
      
      - name: Wait for Katana
        run: sleep 10
      
      - name: Run integration tests
        run: |
          chmod +x scripts/test_local.sh
          ./scripts/test_local.sh --integration
      
      - name: Upload integration results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cairo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Run security audit
        run: |
          cd contracts
          scarb audit
      
      - name: Check code formatting
        run: |
          cd contracts
          scarb fmt --check

  performance-test:
    runs-on: ubuntu-latest
    needs: [test-contracts]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cairo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Start Katana
        run: |
          docker run -d \
            -p 5050:5050 \
            --name katana \
            ghcr.io/dojoengine/katana:v1.5.4 \
            katana --dev --http.addr 0.0.0.0
      
      - name: Wait for Katana
        run: sleep 10
      
      - name: Run performance tests
        run: |
          chmod +x scripts/test_local.sh
          ./scripts/test_local.sh --performance
      
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: performance-results/ 